# Tool normalization table.
#
# Deliberately thin — this is NOT a tool registry (bio.tools and Bioconda already do that well).
# Its only job is to map the many ways a tool is named in prose and in code onto one canonical ID,
# so that chains become comparable.
#
#   id      canonical slug, used in step.tool
#   name    display name
#   roles   step roles this tool can occupy. Multi-role tools (vsearch, qiime2, mothur) are why
#           `role` and `tool` are separate fields — the role must be inferred from context, not
#           from the tool name.
#   aliases matching strings, lowercased and punctuation-stripped before comparison. Include
#           command names as invoked in code, since `observed` extraction reads command lines.
#   kind    tool | suite | library. Suites (qiime2, mothur, anvio, metawrap) absorb many roles and
#           tend to hide their internals — flag chains that are one opaque suite call.
#
# Unknown tools are ALLOWED in records. The validator reports them so this file can grow from real
# extraction rather than from guessing up front.

schema_version: 0.1.0

tools:

  # --- suites ---------------------------------------------------------------
  - {id: qiime2, name: QIIME 2, kind: suite, roles: [demultiplex, remove_primers, denoise, cluster_otu, chimera_removal, filter_features, taxonomy_assign, phylogeny, diversity, ordination, differential_abundance, visualize], aliases: [qiime2, qiime 2, qiime, q2, qiime1]}
  - {id: mothur, name: mothur, kind: suite, roles: [merge_reads, dereplicate, cluster_otu, chimera_removal, taxonomy_assign, diversity, ordination], aliases: [mothur]}
  # Third suite to show the same pattern (after VEBA and BBTools): papers cite the SUBCOMMAND,
  # never the suite. anvi-refine and anvi-pan-genome both went unmatched on real preprints.
  - {id: anvio, name: anvi'o, kind: suite, roles: [assemble, map_reads, bin, bin_refine, bin_qc, annotate_function, pangenome, visualize], aliases: [anvio, anvi'o, anvi o, anvi-refine, anvi-pan-genome, anvi-gen-contigs-database, anvi-run-hmms, anvi-summarize, anvi-cluster-contigs, anvi-estimate-genome-completeness, anvi-interactive]}
  - {id: metawrap, name: metaWRAP, kind: suite, roles: [trim, filter_host, assemble, bin, bin_refine, bin_qc, classify_genomes, quantify], aliases: [metawrap, meta-wrap]}
  # VEBA wraps the whole MAG chain behind module names — papers cite "the preprocess.py module",
  # "assembly.py", "binning.py" rather than the tools underneath. Aliasing the modules to the suite
  # is what lets a chain like that resolve at all; the opacity itself is a finding, not a defect.
  - {id: veba, name: VEBA, kind: suite, roles: [trim, filter_host, assemble, bin, bin_refine, bin_qc, classify_genomes, annotate_function, quantify], aliases: [veba, preprocess py, assembly py, binning py, classify py, annotate py, coverage py, phylogeny py, cluster py]}
  - {id: usearch, name: USEARCH, kind: suite, roles: [dereplicate, cluster_otu, denoise, chimera_removal, taxonomy_assign], aliases: [usearch, uparse, unoise, unoise3, uchime, sintax, utax]}
  - {id: vsearch, name: VSEARCH, kind: suite, roles: [merge_reads, dereplicate, cluster_otu, chimera_removal, taxonomy_assign], aliases: [vsearch]}
  # BBTools ships as individual .sh scripts and papers cite the script, not the suite — so the
  # script names ARE the aliases users will hit. repair.sh turned up in the first real preprint.
  - {id: bbtools, name: BBTools, kind: suite, roles: [trim, filter_host, merge_reads, subsample, error_correct], aliases: [bbtools, bbmap, bbduk, bbsplit, bbmerge, bbnorm, tadpole, reformat sh, repair sh, clumpify, dedupe sh]}
  - {id: seqkit, name: SeqKit, kind: tool, roles: [qc_raw, dereplicate, subsample], aliases: [seqkit]}

